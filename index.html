<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Hub - Authentication</title>
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-container">
    <!-- Card Header Logo / Icon -->
    <div class="logo-wrapper">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
    </div>

    <!-- ==================== LOGIN FORM ==================== -->
    <div class="auth-card" id="login-card">
      <div class="card-header">
        <h1 class="title">Welcome Back</h1>
        <p class="subtitle">Enter your credentials to access your dashboard.</p>
      </div>

      <form id="login-form" autocomplete="off" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email address</label>
          <div class="input-wrapper">
            <input type="email" id="login-email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" placeholder="••••••••" required>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password', this)"
              aria-label="Toggle password visibility">
              <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-row options-row">
          <label class="checkbox-container">
            <input type="checkbox" id="remember-me">
            <span class="checkmark"></span>
            <span class="checkbox-label">Remember me</span>
          </label>
          <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <div class="card-footer">
        <p>Don't have an account? <a href="#" class="switch-link" onclick="switchToRegister(event)">Sign Up</a></p>
      </div>
    </div>

    <!-- ==================== REGISTER FORM ==================== -->
    <div class="auth-card hidden" id="register-card">
      <div class="card-header">
        <h1 class="title">Create Account</h1>
        <p class="subtitle">Join 23.3K+ developers learning conceptual architecture.</p>
      </div>

      <form id="register-form" autocomplete="off" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="reg-name" placeholder="John Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email address</label>
          <div class="input-wrapper">
            <input type="email" id="reg-email" placeholder="john@example.com" required>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="reg-password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="reg-password" placeholder="••••••••" required>
            </div>
          </div>
          <div class="form-group">
            <label for="reg-confirm-password">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" id="reg-confirm-password" placeholder="••••••••" required>
            </div>
          </div>
        </div>

        <!-- Role Toggle Switcher -->
        <div class="form-group">
          <label>I want to register as a:</label>
          <div class="segmented-control" role="radiogroup">
            <button type="button" class="segment-btn active" data-role="Learner"
              onclick="selectRole(this)">Learner</button>
            <button type="button" class="segment-btn" data-role="Author / Contributor" onclick="selectRole(this)">Author
              / Contributor</button>
          </div>
          <input type="hidden" id="selected-role" value="Learner">
        </div>


        <button type="submit" class="submit-btn">Create Account</button>
      </form>

      <div class="card-footer">
        <p>Already have an account? <a href="#" class="switch-link" onclick="switchToLogin(event)">Sign In</a></p>
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div id="toast-container" class="toast-container"></div>

  <script src="script.js"></script>
</body>

</html>
